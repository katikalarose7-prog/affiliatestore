  <text x="898" y="251" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Buy on Amazon</text>

  <!-- Card 2 — Beauty -->
  <rect x="1012" y="106" width="168" height="222" rx="16" fill="#0d111e" stroke="#1e1b4b" stroke-width="1.5"/>
  <rect x="1022" y="116" width="148" height="102" rx="10" fill="#141038"/>
  <text x="1096" y="172" font-size="42" text-anchor="middle" dominant-baseline="middle">&#x1F484;</text>
  <rect x="1022" y="122" width="74" height="20" rx="10" fill="#0f2744"/>
  <text x="1059" y="137" font-family="Arial, sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle" font-weight="600">&#x2B50; Top Rated</text>
  <rect x="1026" y="228" width="90"  height="9" rx="4" fill="#1e293b"/>
  <rect x="1026" y="243" width="64"  height="8" rx="4" fill="#1e293b"/>
  <rect x="1026" y="258" width="112" height="26" rx="8" fill="url(#btngrad2)"/>
  <text x="1082" y="276" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Buy on Amazon</text>

  <!-- Card 3 — Books (partial bottom) -->
  <rect x="836" y="322" width="158" height="196" rx="16" fill="#0d111e" stroke="#0d1f16" stroke-width="1.5"/>
  <rect x="846" y="332" width="138" height="92"  rx="10" fill="#0d1f16"/>
  <text x="915" y="382" font-size="38" text-anchor="middle" dominant-baseline="middle">&#x1F4DA;</text>
  <rect x="846" y="338" width="80" height="20" rx="10" fill="#0f1f38"/>
  <text x="886" y="353" font-family="Arial, sans-serif" font-size="10" fill="#60a5fa" text-anchor="middle" font-weight="600">&#x1F947; Best Seller</text>
  <rect x="850" y="434" width="90"  height="9" rx="4" fill="#1e293b"/>
  <rect x="850" y="450" width="110" height="26" rx="8" fill="url(#btngrad3)"/>
  <text x="905" y="468" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Buy on Amazon</text>
