  <rect x="100" y="404" width="108" height="32" rx="16" fill="#0f2744"/>
  <text x="154" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#7dd3fc" text-anchor="middle">&#x1F484; Beauty</text>

  <rect x="218" y="404" width="144" height="32" rx="16" fill="#141038"/>
  <text x="290" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc" text-anchor="middle">&#x26A1; Electronics</text>

  <rect x="372" y="404" width="118" height="32" rx="16" fill="#0d1f38"/>
  <text x="431" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle">&#x1F457; Fashion</text>

  <rect x="500" y="404" width="112" height="32" rx="16" fill="#0d1f16"/>
  <text x="556" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#6ee7b7" text-anchor="middle">&#x1F4AA; Fitness</text>

