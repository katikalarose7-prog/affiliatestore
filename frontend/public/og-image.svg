<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titlegrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="60%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="btngrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="btngrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="btngrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#080e1f"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
    <circle cx="18" cy="18" r="1" fill="#ffffff" opacity="0.05"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Background glow orbs -->
  <ellipse cx="260" cy="180" rx="300" ry="240" fill="#1d4ed8" opacity="0.10"/>
  <ellipse cx="950" cy="460" rx="260" ry="200" fill="#6366f1" opacity="0.09"/>
  <ellipse cx="1120" cy="60"  rx="200" ry="160" fill="#2563eb" opacity="0.07"/>

  <!-- Left accent line -->
  <rect x="68" y="68" width="5" height="494" rx="2.5" fill="#3b82f6" opacity="0.55"/>

  <!-- ── Logo block ── -->
  <!-- Icon box -->
  <rect x="100" y="84" width="60" height="60" rx="15" fill="#1d4ed8"/>
  <rect x="100" y="84" width="60" height="60" rx="15" fill="#3b82f6" opacity="0.25"/>
  <text x="130" y="123" font-size="30" text-anchor="middle" dominant-baseline="middle">&#x1F6CD;&#xFE0F;</text>

  <!-- PrimeOffers wordmark -->
  <text x="174" y="108" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-1">Prime</text>
