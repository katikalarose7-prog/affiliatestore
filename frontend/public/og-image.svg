  <rect x="818" y="68" width="182" height="236" rx="16" fill="#0d111e" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="828" y="78"  width="162" height="112" rx="10" fill="#0f2744"/>
  <text x="909" y="140" font-size="46" text-anchor="middle" dominant-baseline="middle">&#x1F3A7;</text>
