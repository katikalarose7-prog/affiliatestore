  <text x="159" y="521" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#60a5fa" text-anchor="middle">&#x2605; Top Rated</text>

  <rect x="228" y="502" width="134" height="28" rx="14" fill="#110f30"/>
  <text x="295" y="521" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">&#x1F525; Best Sellers</text>

  <rect x="372" y="502" width="148" height="28" rx="14" fill="#0a1a10"/>
  <text x="446" y="521" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7" text-anchor="middle">&#x2713; Verified Deals</text>

